name: notify-failure

on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions: {}

jobs:
  notify:
    name: notify
    # A fork pull request runs build too, and its branch name and title are written by its
    # author, so only a build of this repository reaches the channel.
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Post the failure to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # Next to the gate above, the post itself mentions nobody, the way the release
          # post in release.yml restricts its mentions.
          payload=$(jq -n --arg content "Build failed on ${BRANCH}: ${TITLE} ${RUN_URL}" \
            '{content: $content, allowed_mentions: {parse: []}}')
          curl -sf -H "Content-Type: application/json" -d "$payload" "$WEBHOOK_URL"
