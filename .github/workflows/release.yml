name: release

on:
  push:
    tags: ["v*"]
  # If Started by hand, the workflow builds and archives everything but stops short of
  # attesting and publishing. That is how it can be tested without spending a tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.name.outputs.version }}
    steps:
      - name: Name this release
        id: name
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=0.0.0-dev
          fi
          case "$version" in
            "" | *[!A-Za-z0-9.+-]* )
              echo "Tag $GITHUB_REF_NAME is not a version this workflow can publish." >&2
              exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet test Borea.slnx --configuration Release

  publish:
    name: publish (${{ matrix.product.name }}, ${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, osx-x64, osx-arm64]
        product:
          - name: App
            project: src/Borea.App/Borea.App.csproj
            executable: Borea.App
            archive-prefix: Borea
          - name: Cli
            project: src/Borea.Cli/Borea.Cli.csproj
            executable: borea
            archive-prefix: Borea-Cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Name this build
        id: name
        env:
          VERSION: ${{ needs.test.outputs.version }}
          RID: ${{ matrix.rid }}
          ARCHIVE_PREFIX: ${{ matrix.product['archive-prefix'] }}
        run: echo "archive=$ARCHIVE_PREFIX-$VERSION-$RID" >> "$GITHUB_OUTPUT"

      # Self-contained, so nobody needs a .NET runtime.
      # Each target builds on a Linux runner.
      - name: Publish
        env:
          VERSION: ${{ needs.test.outputs.version }}
          ARCHIVE: ${{ steps.name.outputs.archive }}
          RID: ${{ matrix.rid }}
          PROJECT: ${{ matrix.product.project }}
        run: >
          dotnet publish "$PROJECT"
          --configuration Release
          --runtime "$RID"
          --self-contained true
          -p:Version="$VERSION"
          --output "publish/$ARCHIVE"

      - name: Add the license
        env:
          ARCHIVE: ${{ steps.name.outputs.archive }}
        run: cp LICENSE "publish/$ARCHIVE/LICENSE"

      - name: Drop the native debug symbols
        env:
          ARCHIVE: ${{ steps.name.outputs.archive }}
        run: find "publish/$ARCHIVE" -name '*.pdb' ! -name 'Borea.*.pdb' -delete

      - name: Make the program executable
        if: matrix.rid != 'win-x64'
        env:
          ARCHIVE: ${{ steps.name.outputs.archive }}
          EXECUTABLE: ${{ matrix.product.executable }}
        run: chmod +x "publish/$ARCHIVE/$EXECUTABLE"

      - name: Archive
        env:
          ARCHIVE: ${{ steps.name.outputs.archive }}
          RID: ${{ matrix.rid }}
        run: |
          mkdir dist
          if [ "$RID" = win-x64 ]; then
            (cd publish && zip -qr "$GITHUB_WORKSPACE/dist/$ARCHIVE.zip" "$ARCHIVE")
          else
            tar -czf "dist/$ARCHIVE.tar.gz" -C publish "$ARCHIVE"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archive-${{ matrix.product.name }}-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          # Already compressed.
          compression-level: 0

  sbom:
    name: sbom (${{ matrix.product.name }})
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        product:
          - name: App
            project: src/Borea.App/Borea.App.csproj
            filename-prefix: Borea
            required-packages: Avalonia CommunityToolkit.Mvvm Tomlyn SkiaSharp
            excluded-package: System.CommandLine
          - name: Cli
            project: src/Borea.Cli/Borea.Cli.csproj
            filename-prefix: Borea-Cli
            required-packages: System.CommandLine Tomlyn
            excluded-package: Avalonia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # Release, like the builds, so the Debug-only packages stay out.
      - name: Restore the release graph
        env:
          PROJECT: ${{ matrix.product.project }}
        run: dotnet restore "$PROJECT" -p:Configuration=Release --locked-mode

      # The tool version is pinned in .config/dotnet-tools.json, where Dependabot keeps it current.
      # Its package hash is separate because dotnet tool restore has no lock file mode.
      - name: Write the SBOM
        env:
          VERSION: ${{ needs.test.outputs.version }}
          PROJECT: ${{ matrix.product.project }}
          FILENAME_PREFIX: ${{ matrix.product['filename-prefix'] }}
        run: |
          bash .github/scripts/verify-dotnet-tool-package.sh
          dotnet CycloneDX "$PROJECT" \
            --output dist --filename "$FILENAME_PREFIX-$VERSION.cdx.json" --output-format Json \
            --set-name "$FILENAME_PREFIX" --set-version "$VERSION" --set-type Application \
            --exclude-dev --disable-package-restore

      - name: Check the SBOM
        env:
          VERSION: ${{ needs.test.outputs.version }}
          FILENAME_PREFIX: ${{ matrix.product['filename-prefix'] }}
          REQUIRED_PACKAGES: ${{ matrix.product['required-packages'] }}
          EXCLUDED_PACKAGE: ${{ matrix.product['excluded-package'] }}
        run: |
          bom="dist/$FILENAME_PREFIX-$VERSION.cdx.json"
          names=$(jq -r '.components[].name' "$bom")
          for p in $REQUIRED_PACKAGES; do
            if ! grep -qx "$p" <<< "$names"; then
              echo "The SBOM does not list $p." >&2
              exit 1
            fi
          done
          for p in "$EXCLUDED_PACKAGE" xunit Microsoft.NET.Test.Sdk coverlet.collector AvaloniaUI.DiagnosticsSupport; do
            if grep -qx "$p" <<< "$names"; then
              echo "The SBOM lists $p, which does not ship." >&2
              exit 1
            fi
          done
          if ! jq -e '([.components[]["bom-ref"]] - [.dependencies[].ref]) == []' "$bom" > /dev/null; then
            echo "A package is missing from the dependency graph." >&2
            exit 1
          fi
          echo "$(wc -l <<< "$names") packages."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ matrix.product.name }}
          path: dist/*.cdx.json
          if-no-files-found: error

  verify-macos:
    name: verify (macOS)
    needs: publish
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: archive-App-osx-arm64
          path: dist
      - name: Report what macOS says about the build
        run: |
          tar -xzf dist/*.tar.gz
          app=$(find . -maxdepth 2 -name Borea.App | head -1)
          codesign --display --verbose=4 "$app"
          codesign --verify --strict --verbose=2 "$app"
          # Mark it the way a browser download would, then ask Gatekeeper.
          xattr -w com.apple.quarantine '0083;00000000;Safari;' "$app"
          spctl --assess --type execute --verbose=4 "$app" || true

  verify-cli:
    name: verify CLI (${{ matrix.rid }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: win-x64
            os: windows-2025
          - rid: osx-arm64
            os: macos-26
          - rid: osx-x64
            os: macos-26-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: archive-Cli-${{ matrix.rid }}
          path: dist
      - name: Check and run the Windows archive
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/Borea-Cli-*.zip
          Expand-Archive $archive -DestinationPath unpacked
          $program = Get-ChildItem unpacked/borea.exe -Recurse
          if (-not (Get-ChildItem unpacked/hostfxr.dll -Recurse)) { throw 'The CLI archive does not contain hostfxr.dll.' }
          & $program.FullName --help
          if ($LASTEXITCODE -ne 0) { throw "borea --help exited with $LASTEXITCODE." }
      - name: Check and run the Unix archive
        if: matrix.rid != 'win-x64'
        shell: bash
        run: |
          archive=$(find dist -name 'Borea-Cli-*.tar.gz' -print -quit)
          mkdir unpacked
          tar -xzf "$archive" -C unpacked
          program=$(find unpacked -type f -name borea -print -quit)
          test -n "$program"
          test -x "$program"
          test -f "$(dirname "$program")/libhostfxr.dylib" || test -f "$(dirname "$program")/libhostfxr.so"
          "$program" --help

  release:
    name: release
    needs: [test, publish, sbom, verify-macos, verify-cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sbom-*
          merge-multiple: true
          path: dist

      - name: Compute the checksums
        working-directory: dist
        run: sha256sum Borea-* > SHA256SUMS.txt

      # Ties every published file to the workflow run that built it.
      # `gh attestation verify` reads this.
      # Skipped for a run started by hand, because an attestation cannot be taken back.
      - name: Attest the files
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      - name: Attest the App SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/Borea-${{ needs.test.outputs.version }}-*.zip
            dist/Borea-${{ needs.test.outputs.version }}-*.tar.gz
          sbom-path: dist/Borea-${{ needs.test.outputs.version }}.cdx.json

      - name: Attest the CLI SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/Borea-Cli-${{ needs.test.outputs.version }}-*.zip
            dist/Borea-Cli-${{ needs.test.outputs.version }}-*.tar.gz
          sbom-path: dist/Borea-Cli-${{ needs.test.outputs.version }}.cdx.json

      # The changelog is fetched here instead of with `gh release create --generate-notes`,
      # so a re-run for the same tag can rewrite the whole body, checksum table included.
      - name: Write the release body
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > generated.md || : > generated.md

          cat > body.md <<'EOF'
          ### Downloads

          | File | SHA-256 |
          | --- | --- |
          EOF
          while read -r sum file; do printf '| %s | `%s` |\n' "$file" "$sum"; done < SHA256SUMS.txt >> body.md
          cat >> body.md <<'EOF'

          Files whose names start with `Borea-Cli-` contain the `borea` command. The other platform archives contain the desktop App.

          The builds include the .NET runtime and are self-contained, so there is nothing to install first.

          ### First start

          These builds are not code signed, so the first start might take an extra step on Windows and macOS. The README has the long explanation.

          **Windows.** Right-click the zip, open Properties and select Unblock. Then unpack it and start `Borea.App.exe`, or run `.\borea.exe --help` from the CLI archive in PowerShell.
          Without that step, Windows shows "Windows protected your PC". This is because the file might not be downloaded often and is not signed. Select "More info", then "Run anyway".

          **Linux.** Unpack the App archive and start `Borea.App`, or unpack the CLI archive and run `./borea --help`. The App needs the X11, fontconfig, ICU and OpenSSL libraries of your distribution, which most desktop installs already have. See Readme.

          **macOS.** Unpack and start Borea from Terminal, not from Finder: `tar -xzf <file>`, then run `./Borea.App` for the App or `./borea --help` for the CLI inside the new folder.

          ### Provenance

          To check that a file came from this workflow:

          ```
          EOF
          {
            echo "gh attestation verify <file> --repo $GITHUB_REPOSITORY \\"
            echo "  --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml"
          } >> body.md
          cat >> body.md <<'EOF'
          ```

          EOF
          cat >> body.md <<EOF
          \`Borea-$VERSION.cdx.json\` is the App software bill of materials, in CycloneDX JSON.
          \`Borea-Cli-$VERSION.cdx.json\` is the CLI software bill of materials.
          Each list includes the NuGet packages for its own project, with version, license and hash.
          Each list is attested only to the archives for the matching product, and you can use this command to prove that it belongs to one.
          With \`--format json\`, the output includes the attested list.

          \`\`\`
          EOF
          {
            echo "gh attestation verify <archive> --repo $GITHUB_REPOSITORY \\"
            echo "  --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml \\"
            echo "  --predicate-type https://cyclonedx.org/bom"
          } >> body.md
          cat >> body.md <<'EOF'
          ```

          Signing will come in the future and is tracked in https://github.com/KSAModding/Borea/issues/76.

          EOF
          cat generated.md >> body.md

      # `gh release create` uploads into a draft and publishes at the end, so a cancelled
      # run leaves a draft behind. That draft must not take the update path below, or the
      # release stays invisible.
      - name: Create or update the release
        if: github.event_name == 'push'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = true ]; then
            echo "Removing the draft a cancelled run left for $GITHUB_REF_NAME."
            gh release delete "$GITHUB_REF_NAME" --yes
            state=missing
          fi
          if [ "$state" = false ]; then
            echo "$GITHUB_REF_NAME already has a release. Replacing its files and notes."
            gh release upload "$GITHUB_REF_NAME" Borea-* SHA256SUMS.txt --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file body.md
          else
            flags=(--verify-tag --notes-file body.md --title "$GITHUB_REF_NAME")
            # Only a SemVer pre-release carries a hyphen.
            case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" Borea-* SHA256SUMS.txt "${flags[@]}"
          fi
