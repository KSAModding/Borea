name: release

on:
  push:
    tags: ["v*"]
  # If Started by hand, the workflow builds and archives everything but stops short of
  # attesting and publishing. That is how it can be tested without spending a tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.name.outputs.version }}
    steps:
      - name: Name this release
        id: name
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=0.0.0-dev
          fi
          case "$version" in
            "" | *[!A-Za-z0-9.+-]* )
              echo "Tag $GITHUB_REF_NAME is not a version this workflow can publish." >&2
              exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet test Borea.slnx --configuration Release

  # One job per platform publishes the App and the CLI, so that both archives get the CLI from the same build.
  # It waits for the SBOMs, which the third-party notices are written from.
  publish:
    name: publish (${{ matrix.rid }})
    needs: [test, sbom]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Name this build
        id: name
        env:
          VERSION: ${{ needs.test.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          echo "app=Borea-$VERSION-$RID" >> "$GITHUB_OUTPUT"
          echo "cli=Borea-Cli-$VERSION-$RID" >> "$GITHUB_OUTPUT"

      # Self-contained, so nobody needs a .NET runtime.
      # Each target builds on a Linux runner.
      # The App and the CLI publish into separate folders, so neither can overwrite a file of the other.
      - name: Publish
        env:
          VERSION: ${{ needs.test.outputs.version }}
          RID: ${{ matrix.rid }}
          APP: ${{ steps.name.outputs.app }}
          CLI: ${{ steps.name.outputs.cli }}
        run: |
          dotnet publish src/Borea.App/Borea.App.csproj \
            --configuration Release --runtime "$RID" --self-contained true \
            -p:Version="$VERSION" --output "publish/$APP"
          dotnet publish src/Borea.Cli/Borea.Cli.csproj \
            --configuration Release --runtime "$RID" --self-contained true \
            -p:Version="$VERSION" --output "publish/$CLI"

      # The App archive also contains borea. The script copies nothing and fails when a file
      # that both publishes write is not byte-identical.
      - name: Add the CLI to the App
        env:
          APP: ${{ steps.name.outputs.app }}
          CLI: ${{ steps.name.outputs.cli }}
        run: bash .github/scripts/combine-publish-outputs.sh "publish/$APP" "publish/$CLI"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sbom

      # Written from the SBOM of each product. The package lists are in .github/notices/notices.json.
      - name: Write the third-party notices
        env:
          VERSION: ${{ needs.test.outputs.version }}
          APP: ${{ steps.name.outputs.app }}
          CLI: ${{ steps.name.outputs.cli }}
        run: |
          packages=$(dotnet nuget locals global-packages --list --force-english-output)
          packages=${packages##*global-packages: }
          python3 .github/scripts/write_third_party_notices.py \
            --sbom "sbom/Borea-$VERSION.cdx.json" --packages "$packages" \
            --deps "publish/$APP/Borea.App.deps.json" --deps "publish/$APP/borea.deps.json" \
            --config .github/notices/notices.json --product App --version "$VERSION" \
            --output "publish/$APP/THIRD-PARTY-NOTICES.txt"
          python3 .github/scripts/write_third_party_notices.py \
            --sbom "sbom/Borea-Cli-$VERSION.cdx.json" --packages "$packages" \
            --deps "publish/$CLI/borea.deps.json" \
            --config .github/notices/notices.json --product Cli --version "$VERSION" \
            --output "publish/$CLI/THIRD-PARTY-NOTICES.txt"

      - name: Add the license
        env:
          APP: ${{ steps.name.outputs.app }}
          CLI: ${{ steps.name.outputs.cli }}
        run: |
          cp LICENSE "publish/$APP/LICENSE"
          cp LICENSE "publish/$CLI/LICENSE"

      - name: Drop the native debug symbols
        run: find publish -name '*.pdb' ! -name 'Borea.*.pdb' -delete

      - name: Make the programs executable
        if: matrix.rid != 'win-x64'
        env:
          APP: ${{ steps.name.outputs.app }}
          CLI: ${{ steps.name.outputs.cli }}
        run: chmod +x "publish/$APP/Borea.App" "publish/$APP/borea" "publish/$CLI/borea"

      - name: Archive
        env:
          APP: ${{ steps.name.outputs.app }}
          CLI: ${{ steps.name.outputs.cli }}
          RID: ${{ matrix.rid }}
        run: |
          mkdir -p dist/App dist/Cli
          if [ "$RID" = win-x64 ]; then
            (cd publish && zip -qr "$GITHUB_WORKSPACE/dist/App/$APP.zip" "$APP")
            (cd publish && zip -qr "$GITHUB_WORKSPACE/dist/Cli/$CLI.zip" "$CLI")
          else
            tar -czf "dist/App/$APP.tar.gz" -C publish "$APP"
            tar -czf "dist/Cli/$CLI.tar.gz" -C publish "$CLI"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archive-App-${{ matrix.rid }}
          path: dist/App/*
          if-no-files-found: error
          # Already compressed.
          compression-level: 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archive-Cli-${{ matrix.rid }}
          path: dist/Cli/*
          if-no-files-found: error
          compression-level: 0

  sbom:
    name: sbom (${{ matrix.product.name }})
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        product:
          # The App archives also contain borea, so the App SBOM covers both projects.
          - name: App
            projects: src/Borea.App/Borea.App.csproj src/Borea.Cli/Borea.Cli.csproj
            filename-prefix: Borea
          - name: Cli
            projects: src/Borea.Cli/Borea.Cli.csproj
            filename-prefix: Borea-Cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # A solution filter with only the projects in the archives, so that restore and the SBOM
      # tool read one package graph for all of them.
      - name: Select the projects
        env:
          PROJECTS: ${{ matrix.product.projects }}
        run: |
          read -ra projects <<< "$PROJECTS"
          jq -n '{solution: {path: "Borea.slnx", projects: $ARGS.positional}}' \
            --args "${projects[@]}" > sbom.slnf

      # Release, like the builds, so the Debug-only packages stay out.
      - name: Restore the release graph
        run: dotnet restore sbom.slnf -p:Configuration=Release --locked-mode

      # The tool version is pinned in .config/dotnet-tools.json, where Dependabot keeps it current.
      # Its package hash is separate because dotnet tool restore has no lock file mode.
      - name: Write the SBOM
        env:
          VERSION: ${{ needs.test.outputs.version }}
          FILENAME_PREFIX: ${{ matrix.product['filename-prefix'] }}
        run: |
          bash .github/scripts/verify-dotnet-tool-package.sh
          dotnet CycloneDX sbom.slnf \
            --output dist --filename "$FILENAME_PREFIX-$VERSION.cdx.json" --output-format Json \
            --set-name "$FILENAME_PREFIX" --set-version "$VERSION" --set-type Application \
            --exclude-dev --disable-package-restore

      - name: Check the SBOM
        env:
          VERSION: ${{ needs.test.outputs.version }}
          FILENAME_PREFIX: ${{ matrix.product['filename-prefix'] }}
          PRODUCT: ${{ matrix.product.name }}
        run: |
          bom="dist/$FILENAME_PREFIX-$VERSION.cdx.json"
          names=$(jq -r '.components[].name' "$bom")
          # The package lists are in .github/notices/notices.json.
          lists=.github/notices/notices.json
          mapfile -t required < <(jq -r --arg product "$PRODUCT" '.products[$product].required[]' "$lists")
          mapfile -t excluded < <(jq -r --arg product "$PRODUCT" '.never_shipped[], .products[$product].excluded[]' "$lists")
          if [ "${#required[@]}" -eq 0 ]; then
            echo "$lists names no required packages for $PRODUCT." >&2
            exit 1
          fi
          for p in "${required[@]}"; do
            if ! grep -qx "$p" <<< "$names"; then
              echo "The SBOM does not list $p." >&2
              exit 1
            fi
          done
          for p in "${excluded[@]}"; do
            if grep -qx "$p" <<< "$names"; then
              echo "The SBOM lists $p, which does not ship." >&2
              exit 1
            fi
          done
          if ! jq -e '([.components[]["bom-ref"]] - [.dependencies[].ref]) == []' "$bom" > /dev/null; then
            echo "A package is missing from the dependency graph." >&2
            exit 1
          fi
          echo "$(wc -l <<< "$names") packages."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ matrix.product.name }}
          path: dist/*.cdx.json
          if-no-files-found: error

  verify-macos:
    name: verify (macOS)
    needs: publish
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: archive-App-osx-arm64
          path: dist
      - name: Report what macOS says about the build
        run: |
          tar -xzf dist/*.tar.gz
          app=$(find . -maxdepth 2 -name Borea.App | head -1)
          codesign --display --verbose=4 "$app"
          codesign --verify --strict --verbose=2 "$app"
          # Mark it the way a browser download would, then ask Gatekeeper.
          xattr -w com.apple.quarantine '0083;00000000;Safari;' "$app"
          spctl --assess --type execute --verbose=4 "$app" || true

  # Both archives of each platform, on a runner that can start its programs.
  # The App is only checked for presence, because it needs a desktop session.
  verify-archives:
    name: verify archives (${{ matrix.rid }})
    needs: [test, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: win-x64
            os: windows-2025
          - rid: osx-arm64
            os: macos-26
          - rid: osx-x64
            os: macos-26-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: archive-App-${{ matrix.rid }}
          path: dist/App
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: archive-Cli-${{ matrix.rid }}
          path: dist/Cli
      - name: Check and run the Windows archives
        if: matrix.rid == 'win-x64'
        shell: pwsh
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          Expand-Archive (Get-ChildItem dist/App/*.zip) -DestinationPath unpacked/App
          Expand-Archive (Get-ChildItem dist/Cli/*.zip) -DestinationPath unpacked/Cli
          $app = @(Get-ChildItem unpacked/App -Directory)
          $cli = @(Get-ChildItem unpacked/Cli -Directory)
          if ($app.Count -ne 1 -or $cli.Count -ne 1) { throw 'Each archive must unpack into one folder.' }
          $app = $app[0].FullName
          $cli = $cli[0].FullName
          if (-not (Test-Path -LiteralPath (Join-Path $app Borea.App.exe) -PathType Leaf)) { throw 'The App archive does not contain Borea.App.exe.' }
          foreach ($root in $cli, $app) {
            if (-not (Test-Path -LiteralPath (Join-Path $root hostfxr.dll) -PathType Leaf)) { throw "$root does not contain hostfxr.dll." }
            if ((Get-Item -LiteralPath (Join-Path $root THIRD-PARTY-NOTICES.txt) -ErrorAction SilentlyContinue).Length -lt 1) { throw "$root does not contain THIRD-PARTY-NOTICES.txt." }
            $program = Join-Path $root borea.exe
            & $program --help
            if ($LASTEXITCODE -ne 0) { throw "borea --help in $root exited with $LASTEXITCODE." }
            $reported = & $program --version
            if ($LASTEXITCODE -ne 0 -or ($reported -ne $env:VERSION -and -not "$reported".StartsWith("$env:VERSION+"))) { throw "borea in $root reports version $reported." }
          }
          if (-not (Select-String -LiteralPath (Join-Path $app THIRD-PARTY-NOTICES.txt) -Pattern '^IBM Plex$' -Quiet)) { throw 'The notices in the App archive do not name IBM Plex.' }
          if (Select-String -LiteralPath (Join-Path $cli THIRD-PARTY-NOTICES.txt) -Pattern '^Avalonia ' -Quiet) { throw 'The notices in the CLI archive name Avalonia.' }
          # The CLI in the App archive is the same build as the CLI archive, with the same runtime files.
          # Only the notices are different, because the App archive contains more software.
          foreach ($file in Get-ChildItem $cli -Recurse -File) {
            $relative = [IO.Path]::GetRelativePath($cli, $file.FullName)
            if ($relative -eq 'THIRD-PARTY-NOTICES.txt') { continue }
            $other = Join-Path $app $relative
            if (-not (Test-Path -LiteralPath $other -PathType Leaf)) { throw "The App archive does not contain $relative." }
            if ((Get-FileHash -LiteralPath $file.FullName).Hash -ne (Get-FileHash -LiteralPath $other).Hash) { throw "$relative is different in the App archive." }
          }
      - name: Check and run the Unix archives
        if: matrix.rid != 'win-x64'
        shell: bash
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          mkdir -p unpacked/App unpacked/Cli
          tar -xzf dist/App/*.tar.gz -C unpacked/App
          tar -xzf dist/Cli/*.tar.gz -C unpacked/Cli
          app=$(find unpacked/App -mindepth 1 -maxdepth 1 -type d -print -quit)
          cli=$(find unpacked/Cli -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$app"
          test -n "$cli"
          test -x "$app/Borea.App"
          for root in "$cli" "$app"; do
            test -x "$root/borea"
            test -f "$root/libhostfxr.dylib" || test -f "$root/libhostfxr.so"
            test -s "$root/THIRD-PARTY-NOTICES.txt"
            "$root/borea" --help
            reported=$("$root/borea" --version)
            if [ "$reported" != "$VERSION" ] && [[ "$reported" != "$VERSION+"* ]]; then
              echo "borea in $root reports version $reported." >&2
              exit 1
            fi
          done
          grep -qx 'IBM Plex' "$app/THIRD-PARTY-NOTICES.txt"
          if grep -q '^Avalonia ' "$cli/THIRD-PARTY-NOTICES.txt"; then
            echo "The notices in the CLI archive name Avalonia." >&2
            exit 1
          fi
          # The CLI in the App archive is the same build as the CLI archive, with the same runtime files.
          # Only the notices are different, because the App archive contains more software.
          while IFS= read -r -d '' file; do
            if [ "$file" = ./THIRD-PARTY-NOTICES.txt ]; then
              continue
            fi
            if ! cmp -s "$cli/$file" "$app/$file"; then
              echo "${file#./} is missing or different in the App archive." >&2
              exit 1
            fi
          done < <(cd "$cli" && find . -type f -print0)

  release:
    name: release
    needs: [test, publish, sbom, verify-macos, verify-archives]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sbom-*
          merge-multiple: true
          path: dist

      # The App archives contain borea, so the App SBOM must list every package of the CLI SBOM.
      - name: Check that the App SBOM covers the CLI
        working-directory: dist
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          missing=$(jq -rn \
            --slurpfile app "Borea-$VERSION.cdx.json" \
            --slurpfile cli "Borea-Cli-$VERSION.cdx.json" \
            '[$cli[0].components[]["bom-ref"]] - [$app[0].components[]["bom-ref"]] | .[]')
          if [ -n "$missing" ]; then
            echo "The App SBOM does not list these CLI packages:" >&2
            echo "$missing" >&2
            exit 1
          fi

      - name: Compute the checksums
        working-directory: dist
        run: sha256sum Borea-* > SHA256SUMS.txt

      # Ties every published file to the workflow run that built it.
      # `gh attestation verify` reads this.
      # Skipped for a run started by hand, because an attestation cannot be taken back.
      - name: Attest the files
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      # This SBOM covers the App and the CLI, because the App archives contain both.
      - name: Attest the App SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/Borea-${{ needs.test.outputs.version }}-*.zip
            dist/Borea-${{ needs.test.outputs.version }}-*.tar.gz
          sbom-path: dist/Borea-${{ needs.test.outputs.version }}.cdx.json

      - name: Attest the CLI SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/Borea-Cli-${{ needs.test.outputs.version }}-*.zip
            dist/Borea-Cli-${{ needs.test.outputs.version }}-*.tar.gz
          sbom-path: dist/Borea-Cli-${{ needs.test.outputs.version }}.cdx.json

      # The changelog is fetched here instead of with `gh release create --generate-notes`,
      # so a re-run for the same tag can rewrite the whole body, checksum table included.
      - name: Write the release body
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > generated.md || : > generated.md

          cat > body.md <<'EOF'
          ### Downloads

          | File | SHA-256 |
          | --- | --- |
          EOF
          while read -r sum file; do printf '| %s | `%s` |\n' "$file" "$sum"; done < SHA256SUMS.txt >> body.md
          cat >> body.md <<'EOF'

          Each platform has two archives. The App archive, for example `Borea-<version>-win-x64.zip`, contains the desktop App and the `borea` command. Most users want this archive.
          Archives whose names start with `Borea-Cli-` are a smaller download that contains only the `borea` command. The `borea` command in both archives is the same build.

          The builds include the .NET runtime and are self-contained, so there is nothing to install first.

          Each archive contains `LICENSE` and `THIRD-PARTY-NOTICES.txt`.

          ### First start

          These builds are not code signed, so the first start might take an extra step on Windows and macOS. The README has the long explanation.

          **Windows.** Right-click the zip, open Properties and select Unblock. Then unpack it and start `Borea.App.exe`, or run `.\borea.exe --help` in PowerShell in the unpacked folder of either archive.
          Without that step, Windows shows "Windows protected your PC". This is because the file might not be downloaded often and is not signed. Select "More info", then "Run anyway".

          **Linux.** Unpack the App archive and start `Borea.App`, or run `./borea --help` in the unpacked folder of either archive. Both need the ICU and OpenSSL libraries of your distribution, and only the App also needs the X11, ICE, SM and fontconfig libraries. Most desktop installs already have them. See Readme.

          **macOS.** Unpack and start Borea from Terminal, not from Finder: `tar -xzf <file>`, then run `./Borea.App` for the App or `./borea --help` for the CLI inside the new folder.

          ### Provenance

          To check that a file came from this workflow:

          ```
          EOF
          {
            echo "gh attestation verify <file> --repo $GITHUB_REPOSITORY \\"
            echo "  --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml"
          } >> body.md
          cat >> body.md <<'EOF'
          ```

          EOF
          cat >> body.md <<EOF
          \`Borea-$VERSION.cdx.json\` is the software bill of materials for the App archives, in CycloneDX JSON.
          The App archives also contain \`borea\`, so this list includes the NuGet packages of the App and of the CLI.
          \`Borea-Cli-$VERSION.cdx.json\` is the software bill of materials for the CLI archives and includes only the packages of the CLI.
          Each list includes the version, license and hash of every package.
          Each list is attested only to the archives that it describes, and you can use this command to prove that it belongs to one.
          With \`--format json\`, the output includes the attested list.

          \`\`\`
          EOF
          {
            echo "gh attestation verify <archive> --repo $GITHUB_REPOSITORY \\"
            echo "  --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml \\"
            echo "  --predicate-type https://cyclonedx.org/bom"
          } >> body.md
          cat >> body.md <<'EOF'
          ```

          Signing will come in the future and is tracked in https://github.com/KSAModding/Borea/issues/76.

          EOF
          cat generated.md >> body.md

      # `gh release create` uploads into a draft and publishes at the end, so a cancelled
      # run leaves a draft behind. That draft must not take the update path below, or the
      # release stays invisible.
      - name: Create or update the release
        if: github.event_name == 'push'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = true ]; then
            echo "Removing the draft a cancelled run left for $GITHUB_REF_NAME."
            gh release delete "$GITHUB_REF_NAME" --yes
            state=missing
          fi
          if [ "$state" = false ]; then
            echo "$GITHUB_REF_NAME already has a release. Replacing its files and notes."
            gh release upload "$GITHUB_REF_NAME" Borea-* SHA256SUMS.txt --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file body.md
          else
            flags=(--verify-tag --notes-file body.md --title "$GITHUB_REF_NAME")
            # Only a SemVer pre-release carries a hyphen.
            case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" Borea-* SHA256SUMS.txt "${flags[@]}"
          fi
