name: release

on:
  push:
    tags: ["v*"]
  # If Started by hand, the workflow builds and archives everything but stops short of
  # attesting and publishing. That is how it can be tested without spending a tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.name.outputs.version }}
    steps:
      - name: Name this release
        id: name
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=0.0.0-dev
          fi
          case "$version" in
            "" | *[!A-Za-z0-9.+-]* )
              echo "Tag $GITHUB_REF_NAME is not a version this workflow can publish." >&2
              exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet test Borea.slnx --configuration Release

  # One job per platform publishes the App and the CLI.
  # It waits for the SBOMs, which the third-party notices are written from.
  publish:
    name: publish (${{ matrix.platform }})
    needs: [test, sbom]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The platform names the archives and artifacts, the runtime identifier goes to dotnet.
        include:
          - rid: win-x64
            platform: win-x64
          - rid: linux-x64
            platform: linux-x64
          - rid: osx-arm64
            platform: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Name this build
        id: name
        env:
          VERSION: ${{ needs.test.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "app=Borea-$VERSION-$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "cli=Borea-Cli-$VERSION-$PLATFORM" >> "$GITHUB_OUTPUT"

      # Self-contained, so nobody needs a .NET runtime.
      # Each target builds on a Linux runner, and the SDK signs the macOS single files ad hoc there too.
      # The project files make each publish one single file, and the App project names its file borea.
      - name: Publish
        env:
          VERSION: ${{ needs.test.outputs.version }}
          RID: ${{ matrix.rid }}
          APP: ${{ steps.name.outputs.app }}
          CLI: ${{ steps.name.outputs.cli }}
        run: |
          dotnet publish src/Borea.App/Borea.App.csproj \
            --configuration Release --runtime "$RID" --self-contained true \
            -p:Version="$VERSION" --output "publish/$APP"
          dotnet publish src/Borea.Cli/Borea.Cli.csproj \
            --configuration Release --runtime "$RID" --self-contained true \
            -p:Version="$VERSION" --output "publish/$CLI"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sbom

      # Written from the SBOM of each product. The package lists are in .github/notices/notices.json.
      # A single file embeds its deps.json, and the publish leaves the same file in the intermediate output folder of the project.
      - name: Write the third-party notices
        env:
          VERSION: ${{ needs.test.outputs.version }}
          RID: ${{ matrix.rid }}
          APP: ${{ steps.name.outputs.app }}
          CLI: ${{ steps.name.outputs.cli }}
        run: |
          intermediate() {
            local dir
            dir=$(dotnet msbuild "$1" -getProperty:IntermediateOutputPath -p:Configuration=Release -p:RuntimeIdentifier="$RID")
            printf '%s/%s' "$(dirname "$1")" "${dir//\\//}"
          }
          app_obj=$(intermediate src/Borea.App/Borea.App.csproj)
          cli_obj=$(intermediate src/Borea.Cli/Borea.Cli.csproj)
          packages=$(dotnet nuget locals global-packages --list --force-english-output)
          packages=${packages##*global-packages: }
          python3 .github/scripts/write_third_party_notices.py \
            --sbom "sbom/Borea-$VERSION.cdx.json" --packages "$packages" \
            --deps "${app_obj}Borea.App.deps.json" \
            --config .github/notices/notices.json --product App --version "$VERSION" \
            --output "publish/$APP/THIRD-PARTY-NOTICES.txt"
          python3 .github/scripts/write_third_party_notices.py \
            --sbom "sbom/Borea-Cli-$VERSION.cdx.json" --packages "$packages" \
            --deps "${cli_obj}borea.deps.json" \
            --config .github/notices/notices.json --product Cli --version "$VERSION" \
            --output "publish/$CLI/THIRD-PARTY-NOTICES.txt"

      - name: Add the license
        env:
          APP: ${{ steps.name.outputs.app }}
          CLI: ${{ steps.name.outputs.cli }}
        run: |
          cp LICENSE "publish/$APP/LICENSE"
          cp LICENSE "publish/$CLI/LICENSE"

      - name: Make the programs executable
        if: matrix.rid != 'win-x64'
        env:
          APP: ${{ steps.name.outputs.app }}
          CLI: ${{ steps.name.outputs.cli }}
        run: chmod +x "publish/$APP/borea" "publish/$CLI/borea"

      - name: Archive
        env:
          APP: ${{ steps.name.outputs.app }}
          CLI: ${{ steps.name.outputs.cli }}
          RID: ${{ matrix.rid }}
        run: |
          mkdir -p dist/App dist/Cli
          if [ "$RID" = win-x64 ]; then
            (cd publish && zip -qr "$GITHUB_WORKSPACE/dist/App/$APP.zip" "$APP")
            (cd publish && zip -qr "$GITHUB_WORKSPACE/dist/Cli/$CLI.zip" "$CLI")
          else
            tar -czf "dist/App/$APP.tar.gz" -C publish "$APP"
            tar -czf "dist/Cli/$CLI.tar.gz" -C publish "$CLI"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archive-App-${{ matrix.platform }}
          path: dist/App/*
          if-no-files-found: error
          # Already compressed.
          compression-level: 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archive-Cli-${{ matrix.platform }}
          path: dist/Cli/*
          if-no-files-found: error
          compression-level: 0

  sbom:
    name: sbom (${{ matrix.product.name }})
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        product:
          # The App contains the CLI, so the App SBOM covers both projects.
          - name: App
            projects: src/Borea.App/Borea.App.csproj src/Borea.Cli/Borea.Cli.csproj
            filename-prefix: Borea
          - name: Cli
            projects: src/Borea.Cli/Borea.Cli.csproj
            filename-prefix: Borea-Cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # A solution filter with only the projects in the archives, so that restore and the SBOM
      # tool read one package graph for all of them.
      - name: Select the projects
        env:
          PROJECTS: ${{ matrix.product.projects }}
        run: |
          read -ra projects <<< "$PROJECTS"
          jq -n '{solution: {path: "Borea.slnx", projects: $ARGS.positional}}' \
            --args "${projects[@]}" > sbom.slnf

      # Release, like the builds, so the Debug-only packages stay out.
      - name: Restore the release graph
        run: dotnet restore sbom.slnf -p:Configuration=Release --locked-mode

      # The tool version is pinned in .config/dotnet-tools.json, where Dependabot keeps it current.
      # Its package hash is separate because dotnet tool restore has no lock file mode.
      - name: Write the SBOM
        env:
          VERSION: ${{ needs.test.outputs.version }}
          FILENAME_PREFIX: ${{ matrix.product['filename-prefix'] }}
        run: |
          bash .github/scripts/verify-dotnet-tool-package.sh
          dotnet CycloneDX sbom.slnf \
            --output dist --filename "$FILENAME_PREFIX-$VERSION.cdx.json" --output-format Json \
            --set-name "$FILENAME_PREFIX" --set-version "$VERSION" --set-type Application \
            --exclude-dev --disable-package-restore

      - name: Check the SBOM
        env:
          VERSION: ${{ needs.test.outputs.version }}
          FILENAME_PREFIX: ${{ matrix.product['filename-prefix'] }}
          PRODUCT: ${{ matrix.product.name }}
        run: |
          bom="dist/$FILENAME_PREFIX-$VERSION.cdx.json"
          names=$(jq -r '.components[].name' "$bom")
          # The package lists are in .github/notices/notices.json.
          lists=.github/notices/notices.json
          mapfile -t required < <(jq -r --arg product "$PRODUCT" '.products[$product].required[]' "$lists")
          mapfile -t excluded < <(jq -r --arg product "$PRODUCT" '.never_shipped[], .products[$product].excluded[]' "$lists")
          if [ "${#required[@]}" -eq 0 ]; then
            echo "$lists names no required packages for $PRODUCT." >&2
            exit 1
          fi
          for p in "${required[@]}"; do
            if ! grep -qx "$p" <<< "$names"; then
              echo "The SBOM does not list $p." >&2
              exit 1
            fi
          done
          for p in "${excluded[@]}"; do
            if grep -qx "$p" <<< "$names"; then
              echo "The SBOM lists $p, which does not ship." >&2
              exit 1
            fi
          done
          if ! jq -e '([.components[]["bom-ref"]] - [.dependencies[].ref]) == []' "$bom" > /dev/null; then
            echo "A package is missing from the dependency graph." >&2
            exit 1
          fi
          echo "$(wc -l <<< "$names") packages."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ matrix.product.name }}
          path: dist/*.cdx.json
          if-no-files-found: error

  verify-macos:
    name: verify (macOS)
    needs: publish
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: archive-App-macos-arm64
          path: dist
      - name: Report what macOS says about the build
        run: |
          tar -xzf dist/*.tar.gz
          app=$(find . -mindepth 2 -maxdepth 2 -type f -name borea | head -1)
          codesign --display --verbose=4 "$app"
          codesign --verify --strict --verbose=2 "$app"
          # Mark it the way a browser download would, then ask Gatekeeper.
          xattr -w com.apple.quarantine '0083;00000000;Safari;' "$app"
          spctl --assess --type execute --verbose=4 "$app" || true
      - name: Run the moves a self-update makes
        run: |
          mkdir update-test
          tar -xzf dist/*.tar.gz -C update-test
          folder=$(find update-test -mindepth 1 -maxdepth 1 -type d | head -1)
          cp "$folder/borea" "$folder/borea.new"
          # An update moves the program that runs aside and puts the new one in its place.
          mv "$folder/borea" "$folder/borea.old"
          mv "$folder/borea.new" "$folder/borea"
          codesign --verify --strict --verbose=2 "$folder/borea"
          "$folder/borea" --version
          # A step that fails puts the program that ran back, over the one that took its place.
          mv "$folder/borea.old" "$folder/borea"
          codesign --verify --strict --verbose=2 "$folder/borea"
          "$folder/borea" --version

  # Both archives of each platform, on a runner that can start their programs.
  # No App window opens, because that needs a desktop session.
  # The borea of the App archive must run the command line without one, like the borea of the CLI archive.
  verify-archives:
    name: verify archives (${{ matrix.platform }})
    needs: [test, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: win-x64
            os: windows-2025
          - platform: macos-arm64
            os: macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: archive-App-${{ matrix.platform }}
          path: dist/App
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: archive-Cli-${{ matrix.platform }}
          path: dist/Cli
      - name: Check and run the Windows archives
        if: matrix.platform == 'win-x64'
        shell: pwsh
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          $expected = 'LICENSE', 'THIRD-PARTY-NOTICES.txt', 'borea.exe'
          $roots = @{}
          foreach ($kind in 'App', 'Cli') {
            Expand-Archive (Get-ChildItem "dist/$kind/*.zip") -DestinationPath "unpacked/$kind"
            $top = @(Get-ChildItem "unpacked/$kind" -Force)
            if ($top.Count -ne 1 -or -not $top[0].PSIsContainer) { throw "The $kind archive must unpack into one folder." }
            $root = $top[0].FullName
            $found = @(Get-ChildItem -LiteralPath $root -Recurse -Force | ForEach-Object { [IO.Path]::GetRelativePath($root, $_.FullName) })
            if (Compare-Object $expected $found -CaseSensitive) { throw "The $kind archive holds $($found -join ', ') instead of $($expected -join ', ')." }
            if ((Get-Item -LiteralPath (Join-Path $root THIRD-PARTY-NOTICES.txt)).Length -lt 1) { throw "THIRD-PARTY-NOTICES.txt in the $kind archive is empty." }
            $roots[$kind] = $root
          }
          if (-not (Select-String -LiteralPath (Join-Path $roots.App THIRD-PARTY-NOTICES.txt) -Pattern '^IBM Plex$' -Quiet)) { throw 'The notices in the App archive do not name IBM Plex.' }
          if (Select-String -LiteralPath (Join-Path $roots.Cli THIRD-PARTY-NOTICES.txt) -Pattern '^Avalonia ' -Quiet) { throw 'The notices in the CLI archive name Avalonia.' }
          $help = @{}
          $settings = @{}
          foreach ($kind in 'Cli', 'App') {
            $program = Join-Path $roots[$kind] borea.exe
            $help[$kind] = & $program --help | Out-String
            if ($LASTEXITCODE -ne 0) { throw "borea --help from the $kind archive exited with $LASTEXITCODE." }
            $reported = & $program --version
            if ($LASTEXITCODE -ne 0 -or ($reported -ne $env:VERSION -and -not "$reported".StartsWith("$env:VERSION+"))) { throw "borea from the $kind archive reports version $reported." }
            & $program no-such-command
            if ($LASTEXITCODE -ne 2) { throw "borea no-such-command from the $kind archive exited with $LASTEXITCODE instead of 2." }
            $settings[$kind] = & $program settings show --json | Out-String
            if ($LASTEXITCODE -ne 0) { throw "borea settings show from the $kind archive exited with $LASTEXITCODE." }
          }
          $help.App
          $settings.App
          if ($help.App -cne $help.Cli) { throw 'borea --help prints different text from the two archives.' }
          if ($settings.App -cne $settings.Cli) { throw 'borea settings show prints different text from the two archives.' }
          # See the comment in the Unix step: a request is what shows a runtime
          # that corrupts memory, and exit code 1 is an operation that failed.
          # The step ends with the exit code of the last program, so it is reset.
          & (Join-Path $roots.App borea.exe) index refresh
          $refresh = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($refresh -gt 1) { throw "borea index refresh crashed with exit code $refresh." }
      - name: Check and run the Unix archives
        if: matrix.platform != 'win-x64'
        shell: bash
        env:
          VERSION: ${{ needs.test.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          expected=$(printf '%s\n' LICENSE THIRD-PARTY-NOTICES.txt borea | LC_ALL=C sort)
          for kind in App Cli; do
            mkdir -p "unpacked/$kind"
            tar -xzf "dist/$kind/"*.tar.gz -C "unpacked/$kind"
            if [ "$(find "unpacked/$kind" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" != 1 ]; then
              echo "The $kind archive must unpack into one folder." >&2
              exit 1
            fi
          done
          app=$(find unpacked/App -mindepth 1 -maxdepth 1 -type d -print -quit)
          cli=$(find unpacked/Cli -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$app"
          test -n "$cli"
          for root in "$cli" "$app"; do
            found=$(cd "$root" && find . -mindepth 1 | sed 's|^\./||' | LC_ALL=C sort)
            if [ "$found" != "$expected" ]; then
              echo "$root holds these files instead of borea, LICENSE and THIRD-PARTY-NOTICES.txt:" >&2
              echo "$found" >&2
              exit 1
            fi
            test -x "$root/borea"
            test -s "$root/THIRD-PARTY-NOTICES.txt"
            reported=$("$root/borea" --version)
            if [ "$reported" != "$VERSION" ] && [[ "$reported" != "$VERSION+"* ]]; then
              echo "borea in $root reports version $reported." >&2
              exit 1
            fi
            status=0
            "$root/borea" no-such-command || status=$?
            if [ "$status" -ne 2 ]; then
              echo "borea no-such-command in $root exited with $status instead of 2." >&2
              exit 1
            fi
          done
          grep -qx 'IBM Plex' "$app/THIRD-PARTY-NOTICES.txt"
          if grep -q '^Avalonia ' "$cli/THIRD-PARTY-NOTICES.txt"; then
            echo "The notices in the CLI archive name Avalonia." >&2
            exit 1
          fi
          cli_help=$("$cli/borea" --help)
          app_help=$("$app/borea" --help)
          cli_settings=$("$cli/borea" settings show --json)
          app_settings=$("$app/borea" settings show --json)
          printf '%s\n%s\n' "$app_help" "$app_settings"
          if [ "$app_help" != "$cli_help" ]; then
            echo "borea --help prints different text from the two archives." >&2
            exit 1
          fi
          if [ "$app_settings" != "$cli_settings" ]; then
            echo "borea settings show prints different text from the two archives." >&2
            exit 1
          fi
          # Only a start that makes a request shows a runtime that corrupts memory
          # there, as dotnet/runtime#123324 did on macOS. Exit code 1 is a failed
          # operation, which a host that does not answer gives as well, so only a
          # higher code is a crash. macOS starts it several times, because that
          # crash did not happen on every start.
          starts=1
          if [ "$PLATFORM" = macos-arm64 ]; then
            starts=3
          fi
          for start in $(seq 1 "$starts"); do
            status=0
            "$app/borea" index refresh || status=$?
            if [ "$status" -gt 1 ]; then
              echo "borea index refresh crashed with exit code $status on start $start." >&2
              exit 1
            fi
          done

  release:
    name: release
    needs: [test, publish, sbom, verify-macos, verify-archives]
    runs-on: ubuntu-24.04
    outputs:
      # Only a run that created the release sets this, so only that run posts to Discord.
      created: ${{ steps.create.outputs.created }}
      notes: ${{ steps.body.outputs.notes }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sbom-*
          merge-multiple: true
          path: dist

      # The App contains the CLI, so the App SBOM must list every package of the CLI SBOM.
      - name: Check that the App SBOM covers the CLI
        working-directory: dist
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          missing=$(jq -rn \
            --slurpfile app "Borea-$VERSION.cdx.json" \
            --slurpfile cli "Borea-Cli-$VERSION.cdx.json" \
            '[$cli[0].components[]["bom-ref"]] - [$app[0].components[]["bom-ref"]] | .[]')
          if [ -n "$missing" ]; then
            echo "The App SBOM does not list these CLI packages:" >&2
            echo "$missing" >&2
            exit 1
          fi

      - name: Compute the checksums
        working-directory: dist
        run: sha256sum Borea-* > SHA256SUMS.txt

      # Ties every published file to the workflow run that built it.
      # `gh attestation verify` reads this.
      # Skipped for a run started by hand, because an attestation cannot be taken back.
      - name: Attest the files
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*

      # This SBOM covers the App and the CLI, because the App archives contain both.
      - name: Attest the App SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/Borea-${{ needs.test.outputs.version }}-*.zip
            dist/Borea-${{ needs.test.outputs.version }}-*.tar.gz
          sbom-path: dist/Borea-${{ needs.test.outputs.version }}.cdx.json

      - name: Attest the CLI SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/Borea-Cli-${{ needs.test.outputs.version }}-*.zip
            dist/Borea-Cli-${{ needs.test.outputs.version }}-*.tar.gz
          sbom-path: dist/Borea-Cli-${{ needs.test.outputs.version }}.cdx.json

      # The changelog is fetched here instead of with `gh release create --generate-notes`,
      # so a re-run for the same tag can rewrite the whole body, checksum table included.
      # .github/release-notes/<version>.md in the tagged commit, when it exists, goes first.
      # GitHub starts the change list at the previous release of any kind, so a stable release
      # names the previous stable release, and dev and beta builds in between do not shorten it.
      - name: Write the release body
        id: body
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          previous=()
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *)
              stable=$(gh release list --exclude-pre-releases --exclude-drafts --limit 20 \
                --json tagName --jq "map(.tagName | select(. != \"$GITHUB_REF_NAME\")) | .[0] // empty") || stable=
              if [ -n "$stable" ]; then previous=(-f previous_tag_name="$stable"); fi ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" "${previous[@]}" --jq .body > generated.md || : > generated.md

          if ! gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/.github/release-notes/$VERSION.md?ref=$GITHUB_SHA" > intro.md 2> /dev/null; then
            : > intro.md
          fi

          if [ -s intro.md ]; then
            { cat intro.md; echo; } > body.md
          else
            : > body.md
          fi
          cat >> body.md <<'EOF'
          ### Downloads

          | File | SHA-256 |
          | --- | --- |
          EOF
          while read -r sum file; do printf '| %s | `%s` |\n' "$file" "$sum"; done < SHA256SUMS.txt >> body.md
          cat >> body.md <<'EOF'

          Each platform has two archives.
          The App archive, for example `Borea-<version>-win-x64.zip`, contains the program `borea`.
          Without arguments, `borea` opens the desktop App, and with arguments, it runs a command.
          Most users want this archive.
          Archives whose names start with `Borea-Cli-` are a smaller download that contains only the command line.

          The builds include the .NET runtime and are self-contained, so there is nothing to install first.

          Each archive contains `borea` (`borea.exe` on Windows), `LICENSE` and `THIRD-PARTY-NOTICES.txt`.

          ### First start

          These builds are not code signed, so the first start might take an extra step on Windows and macOS. The README has the long explanation.

          **Windows.** Right-click the zip, open Properties and select Unblock.
          Then unpack the App archive and start `borea.exe`, or run `.\borea.exe --help` in PowerShell in the unpacked folder of either archive.
          Without that step, Windows shows "Windows protected your PC". This is because the file might not be downloaded often and is not signed. Select "More info", then "Run anyway".

          **Linux.** Unpack the App archive and run `./borea` for the App, or run `./borea --help` in the unpacked folder of either archive.
          Both need the ICU and OpenSSL libraries of your distribution, and only the App also needs the X11, ICE, SM and fontconfig libraries. Most desktop installs already have them. See Readme.

          **macOS.** Unpack and start Borea from Terminal, not from Finder: `tar -xzf <file>`, then run `./borea` inside the new folder of the App archive for the App, or `./borea --help` inside the new folder of either archive.
          The macOS builds are for Apple silicon. Intel Macs are not supported.

          ### Provenance

          To check that a file came from this workflow:

          ```
          EOF
          {
            echo "gh attestation verify <file> --repo $GITHUB_REPOSITORY \\"
            echo "  --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml"
          } >> body.md
          cat >> body.md <<'EOF'
          ```

          EOF
          cat >> body.md <<EOF
          \`Borea-$VERSION.cdx.json\` is the software bill of materials for the App archives, in CycloneDX JSON.
          The App contains the command line, so this list includes the NuGet packages of the App and of the CLI.
          \`Borea-Cli-$VERSION.cdx.json\` is the software bill of materials for the CLI archives and includes only the packages of the CLI.
          Each list includes the version, license and hash of every package.
          Each list is attested only to the archives that it describes, and you can use this command to prove that it belongs to one.
          With \`--format json\`, the output includes the attested list.

          \`\`\`
          EOF
          {
            echo "gh attestation verify <archive> --repo $GITHUB_REPOSITORY \\"
            echo "  --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml \\"
            echo "  --predicate-type https://cyclonedx.org/bom"
          } >> body.md
          cat >> body.md <<'EOF'
          ```

          Signing will come in the future and is tracked in https://github.com/KSAModding/Borea/issues/76.

          EOF
          cat generated.md >> body.md

          # The announce job gets the notes as an environment variable, which Linux limits, so they are cut to 100 KB.
          delimiter="notes_$(openssl rand -hex 16)"
          {
            echo "notes<<$delimiter"
            LC_ALL=C awk '{ size += length($0) + 1; if (size > 100000) exit; print }' generated.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # `gh release create` uploads into a draft and publishes at the end, so a cancelled
      # run leaves a draft behind. That draft must not take the update path below, or the
      # release stays invisible.
      - name: Create or update the release
        id: create
        if: github.event_name == 'push'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = true ]; then
            echo "Removing the draft a cancelled run left for $GITHUB_REF_NAME."
            gh release delete "$GITHUB_REF_NAME" --yes
            state=missing
          fi
          if [ "$state" = false ]; then
            echo "$GITHUB_REF_NAME already has a release. Replacing its files and notes."
            gh release upload "$GITHUB_REF_NAME" Borea-* SHA256SUMS.txt --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file body.md
          else
            flags=(--verify-tag --notes-file body.md --title "$GITHUB_REF_NAME")
            # Only a SemVer pre-release carries a hyphen.
            case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" Borea-* SHA256SUMS.txt "${flags[@]}"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  # Posts the new release to Discord, only from the run that created it.
  # CONTRIBUTING.md lists the secrets and variables for the webhook and the bot.
  announce:
    name: announce
    needs: [test, release]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    steps:
      # Inline, because this job has no checkout. test-release-announcement.sh runs it from here.
      - name: Post the release to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          BOT_TOKEN: ${{ secrets.DISCORD_RELEASE_BOT_TOKEN }}
          CHANNEL_ID: ${{ vars.DISCORD_RELEASE_CHANNEL_ID }}
          ROLE_ID: ${{ vars.DISCORD_RELEASE_ROLE_ID }}
          VERSION: ${{ needs.test.outputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          NOTES: ${{ needs.release.outputs.notes }}
        run: |
          if [ -z "$BOT_TOKEN" ] && [ -z "$WEBHOOK_URL" ]; then
            echo "Neither DISCORD_RELEASE_BOT_TOKEN nor DISCORD_RELEASE_WEBHOOK_URL is set, so the release is not posted to Discord."
            exit 0
          fi
          is_id() { [[ $1 =~ ^[0-9]{1,20}$ ]]; }
          if [ -n "$BOT_TOKEN" ]; then
            if ! is_id "$CHANNEL_ID"; then
              echo "DISCORD_RELEASE_BOT_TOKEN is set, but DISCORD_RELEASE_CHANNEL_ID is not a Discord id." >&2
              exit 1
            fi
            if [ -n "$WEBHOOK_URL" ]; then
              echo "::warning::DISCORD_RELEASE_BOT_TOKEN and DISCORD_RELEASE_WEBHOOK_URL are both set, so the bot posts and the webhook is not used."
            fi
          fi
          if [ -n "$ROLE_ID" ] && ! is_id "$ROLE_ID"; then
            echo "DISCORD_RELEASE_ROLE_ID is not a Discord id." >&2
            exit 1
          fi
          # At most 1900 characters, below Discord's 2000. Only the role can be mentioned, and not for a pre-release.
          payload=$(jq -n \
            --arg version "$VERSION" --arg url "$RELEASE_URL" --arg notes "$NOTES" --arg role "$ROLE_ID" \
            --argjson shown 10 --argjson entry_limit 180 --argjson limit 1900 '
            def ping: $role != "" and ($version | contains("-") | not);
            def cut($n): if length > $n then .[0:$n - 3] + "..." else . end;
            def changes:
              reduce ($notes | split("\n")[] | rtrimstr("\r")) as $line ({inside: false, items: []};
                if ($line | startswith("## ")) then .inside = ($line | test("^## What.s Changed"))
                elif .inside and ($line | startswith("* ")) then .items += [$line[2:]]
                else . end)
              | .items
              | map(sub(" by @[^ ]+ in https://[^ ]+/pull/(?<number>[0-9]+)$"; " (#\(.number))") | cut($entry_limit));
            def message($items; $k):
              ([
                (if ping then "<@&\($role)> " else "" end)
                  + "**Borea \($version)**" + (if ($version | contains("-")) then " (pre-release)" else "" end),
                $url,
                "App with the `borea` command: `Borea-\($version)-<platform>` for Windows, Linux and macOS",
                "CLI only: `Borea-Cli-\($version)-<platform>` for the same platforms"
              ]
              + (if ($items | length) == 0 then []
                 else ["", "Changes:"] + ($items[0:$k] | map("- " + .))
                   + (if ($items | length) > $k then ["and \(($items | length) - $k) more"] else [] end)
                 end))
              | join("\n");
            changes as $items
            | [range([($items | length), $shown] | min; -1; -1) as $k | message($items; $k) | select(length <= $limit)]
            | {content: (.[0] // (message([]; 0) | cut($limit))),
               allowed_mentions: ({parse: []} + if ping then {roles: [$role]} else {} end)}
          ')
          # No retry, which could post twice. A failed post fails the run.
          response=$(mktemp)
          post() {
            if ! curl -sS --fail-with-body -o "$response" --max-time 30 -H "Content-Type: application/json" \
              -H "User-Agent: DiscordBot ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY, $VERSION)" -d "$payload" "$@"; then
              # Only the error code and message, never the request.
              jq -r 'select(type == "object" and .code != null) | "Discord answered \(.code): \(.message)"' "$response" >&2 2> /dev/null || true
              return 1
            fi
          }
          if [ -n "$BOT_TOKEN" ]; then
            # Through stdin, so the token is not on the curl command line.
            printf 'Authorization: Bot %s\n' "$BOT_TOKEN" | post -H @- "https://discord.com/api/v10/channels/$CHANNEL_ID/messages"
          else
            # Without wait=true, Discord does not report a message that it did not save.
            case "$WEBHOOK_URL" in *\?*) separator='&' ;; *) separator='?' ;; esac
            post "${WEBHOOK_URL}${separator}wait=true"
          fi
