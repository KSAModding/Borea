name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    # a test that blocks the headless thread takes the whole job with it, and the
    # run then holds a machine until somebody cancels it, so the job gives up first
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Verify the SBOM tool package
        if: matrix.os == 'ubuntu-24.04'
        run: bash .github/scripts/verify-dotnet-tool-package.sh
      - run: dotnet build Borea.slnx --configuration Release
      # Collected on every leg, reported from Linux only so one build is one Coveralls job.
      # A test that never returns is reported as that test with a dump of where it
      # stopped, because a run that only hangs is cancelled by a person later and
      # a cancelled check does not read as a failure.
      - run: dotnet test Borea.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory coverage --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type full
      - name: Keep the hang dump
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hang-dump-${{ matrix.os }}
          path: coverage/**/*.dmp
          if-no-files-found: ignore

      # Merge the per-project Cobertura files into one lcov report; lcov keeps the absolute
      # source paths Coveralls needs, and the filter drops generated code under obj/.
      - name: Merge coverage reports
        if: matrix.os == 'ubuntu-24.04'
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # 5.5.11
        with:
          reports: coverage/**/coverage.cobertura.xml
          targetdir: coverage/merged
          reporttypes: lcov
          filefilters: '-*/obj/*'
          toolpath: ${{ runner.temp }}/reportgenerator

      - name: Report coverage to Coveralls
        if: matrix.os == 'ubuntu-24.04'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          file: coverage/merged/lcov.info
          format: lcov
          fail-on-error: false

  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet format Borea.slnx --verify-no-changes

  # Pull requests do not run the release and pages workflows, so the tests of their scripts run here.
  release-scripts:
    name: release scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # test_single_file_settings.py reads the publish settings from MSBuild.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Test the Python scripts
        run: python3 -m unittest discover --start-directory .github/scripts/tests --pattern 'test_*.py' --verbose
      - name: Test the Discord release post
        run: bash .github/scripts/tests/test-release-announcement.sh
