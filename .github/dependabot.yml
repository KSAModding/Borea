version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Minor and patch bumps as one pull request instead of one each.
      minor-and-patch:
        update-types: ["minor", "patch"]
